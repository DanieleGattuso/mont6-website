<!DOCTYPE html>
<html lang="it" data-lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mont°6 — Stato della prenotazione</title>
    <!-- Pagina di ritorno da Stripe: fuori dall'indice. Il noindex funziona solo
         se Google puo' leggerla, per questo robots.txt non la blocca piu' -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <script src="lang-init.js"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon.png">
    
    <!-- CSS (riutilizza il foglio di stile principale) -->
    <link rel="stylesheet" href="style.css?v=27">
    
    <style>
        .success-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-m) 0;
            background-color: var(--color-bg-light);
            text-align: center;
        }
        .success-card {
            background: #fff;
            padding: 4rem;
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.04);
            max-width: 600px;
            width: 90%;
            margin: 0 auto;
            border: 1px solid rgba(0,0,0,0.03);
        }
        .success-icon {
            color: var(--color-accent);
            margin-bottom: 2rem;
        }
        .success-title {
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: 1.5rem;
        }
        .success-card p {
            margin-bottom: 1.5rem;
        }
        .btn-success-home {
            background-color: var(--color-bg-dark);
            color: #fff;
            margin-top: 2rem;
            width: 100%;
        }
        .btn-success-home:hover {
            background-color: var(--color-accent);
            color: #fff;
        }
    </style>
</head>
<body class="editorial-theme">

    <main class="success-wrapper">
        <div class="success-card">
            <div class="success-icon" id="confirmed-icon" hidden>
                <svg viewBox="0 0 24 24" width="64" height="64" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>
            
            <h1 class="success-title" id="booking-status-title">
                <span class="lang-it">Verifica della prenotazione</span>
                <span class="lang-en">Checking your booking</span>
            </h1>
            
            <p class="lead-text" id="booking-status-message" role="status" aria-live="polite">
                <span class="lang-it">Attendi mentre verifichiamo il pagamento e le date.</span>
                <span class="lang-en">Please wait while we verify your payment and dates.</span>
            </p>
            
            <p id="booking-status-details" hidden></p>
            <noscript><span class="lang-it">Per verificare la prenotazione abilita JavaScript o scrivimi su WhatsApp.</span><span class="lang-en">Enable JavaScript or contact me on WhatsApp to verify your booking.</span></noscript>

            <a href="/" id="booking-home" class="btn-luxe btn-success-home">
                <span class="lang-it">Torna al sito</span>
                <span class="lang-en">Back to the site</span>
            </a>

            <p style="margin-top: 1.5rem; font-size: 0.85rem; color: var(--color-text-light);">
                <span class="lang-it">Domande? Scrivimi su <a href="https://wa.me/393881908816" target="_blank" rel="noopener" style="color: var(--color-accent);">WhatsApp</a>.</span>
                <span class="lang-en">Questions? Message me on <a href="https://wa.me/393881908816" target="_blank" rel="noopener" style="color: var(--color-accent);">WhatsApp</a>.</span>
            </p>
        </div>
    </main>

    <!-- Semplice script per gestire la lingua salvata -->
    <script src="booking-status.js?v=1"></script>
    <!-- COOKIE_NOTICE -->
    <script src="/cookie-notice.js?v=1" defer></script>
</body>
</html>
