<!DOCTYPE html>
<html lang="it" data-lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mont°6 — Pagina non trovata</title>
    <meta name="robots" content="noindex">

    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon.png">
    <link rel="stylesheet" href="/style.css?v=23">

    <style>
        .nf-wrap {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: var(--space-m) 1.5rem; background-color: var(--color-bg-light); text-align: center;
        }
        .nf-code {
            font-family: var(--font-heading); font-size: 4rem; line-height: 1;
            color: var(--color-accent); margin-bottom: 1.5rem;
        }
        .nf-wrap p { margin-bottom: 2rem; }
        .nf-links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    </style>
</head>
<body class="editorial-theme">

    <div class="nf-wrap">
        <div>
            <div class="nf-code">404</div>
            <h1 class="section-title">
                <span class="lang-it">Questa pagina non esiste</span>
                <span class="lang-en">This page does not exist</span>
            </h1>
            <p class="lead-text">
                <span class="lang-it">Forse il link è vecchio, o c'è un refuso nell'indirizzo.</span>
                <span class="lang-en">The link may be out of date, or the address has a typo.</span>
            </p>
            <div class="nf-links">
                <a href="/" class="btn-luxe btn-hero">
                    <span class="lang-it">Torna al sito</span>
                    <span class="lang-en">Back to the site</span>
                </a>
                <a href="/#booking" class="btn-luxe btn-outline">
                    <span class="lang-it">Verifica disponibilità</span>
                    <span class="lang-en">Check availability</span>
                </a>
            </div>
        </div>
    </div>

    <script src="/lang-init.js"></script>
</body>
</html>
